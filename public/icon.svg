<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="flaskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0.9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />

  <!-- Outer subtle glowing ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#38bdf8" stroke-width="6" opacity="0.3" />

  <!-- Laboratory Flask & Cross Icon -->
  <g transform="translate(136, 120)">
    <!-- Flask neck -->
    <rect x="96" y="20" width="48" height="60" rx="6" fill="#ffffff" opacity="0.95" />
    <rect x="88" y="10" width="64" height="16" rx="4" fill="#ffffff" />
    <!-- Flask body -->
    <path d="M 96 75 L 20 220 C 10 240 25 260 50 260 L 190 260 C 215 260 230 240 220 220 L 144 75 Z" fill="url(#flaskGrad)" filter="url(#glow)" />
    <!-- Liquid wave level inside flask -->
    <path d="M 36 215 Q 80 195 120 215 T 204 215 L 190 260 L 50 260 Z" fill="#ffffff" opacity="0.9" />
    <!-- Medical Cross inside liquid -->
    <rect x="110" y="150" width="20" height="70" rx="4" fill="#0284c7" />
    <rect x="85" y="175" width="70" height="20" rx="4" fill="#0284c7" />
  </g>
</svg>
